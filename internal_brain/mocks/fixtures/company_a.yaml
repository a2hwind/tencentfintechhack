# Company A: the fixture every demo and test runs against.
#
# It is built around the challenge statement's own examples (the DB migration, the
# payment-service runbook, the Q3 breach report, the payment-gateway space) so that
# every judge recognises the scenarios. Timestamps are relative (days_ago / hours_ago)
# and resolved when the fixture loads, so "last week" always means last week.
#
# Canary strings (CANARY-*) mark restricted text. Tests assert that no canary ever
# reaches a prompt or an answer for a user who lacks the matching entitlement.

company:
  name: Company A
  domain: company-a.com
  slack_workspace: T0COMPA

users:
  - id: jdoe
    name: Jane Doe
    email: jdoe@company-a.com
    title: Backend engineer
    roles: [employee]
    platform_ids: {confluence: jdoe, jira: jdoe, slack: U0JDOE, gdrive: jdoe@company-a.com}
  - id: ctr-lee
    name: Lee Wei
    email: lee@vendorworks.example
    title: External contractor (VendorWorks)
    roles: [contractor]
    slack_guest: true
    platform_ids: {slack: U0CTRLEE, gdrive: lee@vendorworks.example}
